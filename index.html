<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expertise Écrite - Centre Al Akhawayn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    :root { --primary: #c5221f; --navy: #0b1528; --gold: #eab308; --bg: #f8fafc; }
    body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: #1e293b; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 24px; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--bg); padding-bottom: 20px; margin-bottom: 30px; }
    .brand { font-family: 'Outfit'; font-size: 28px; font-weight: 800; color: var(--primary); }
    .brand span { color: var(--navy); }

    /* Inputs */
    .input-group { margin-bottom: 25px; }
    label { display: block; font-weight: 800; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; color: var(--navy); }
    input, textarea, select { width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; font-size: 15px; transition: 0.3s; }
    input:focus, textarea:focus { border-color: var(--primary); }
    .writing-paper { min-height: 350px; line-height: 30px; background-attachment: local; background-image: linear-gradient(to bottom, transparent 29px, #e2e8f0 29px); background-size: 100% 30px; border-color: var(--navy); }

    /* Rapport */
    #reportSection { display: none; margin-top: 50px; animation: fadeIn 0.8s; }
    .card { background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .score-banner { display: flex; justify-content: space-between; align-items: center; background: var(--navy); color: white; padding: 20px 30px; border-radius: 16px; margin-bottom: 30px; }
    
    /* Coloration IA */
    .error-red { color: #e11d48; font-weight: 800; text-decoration: underline; }
    .connector-blue { color: #2563eb; font-weight: 800; }
    
    /* Couleurs des Plans */
    .plan-intro { background: #fef3c7; padding: 15px; border-left: 5px solid var(--gold); border-radius: 8px; margin-bottom: 10px; }
    .plan-body { background: #dcfce7; padding: 15px; border-left: 5px solid #16a34a; border-radius: 8px; margin-bottom: 10px; }
    .plan-concl { background: #e0e7ff; padding: 15px; border-left: 5px solid #4338ca; border-radius: 8px; }
    .model-connector { color: #c5221f; font-weight: 800; text-decoration: underline; }

    /* Onglets */
    .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: 800; background: #e2e8f0; transition: 0.3s; }
    .tab-btn.active { background: var(--primary); color: white; }
    
    .btn-submit { width: 100%; background: var(--primary); color: white; padding: 20px; border: none; border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; }
    .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(197,34,31,0.2); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { background: #f1f5f9; text-align: left; padding: 12px; font-size: 13px; }
    td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand">CENTRE <span>AL AKHAWAYN</span></div>
    <div class="badge">EVALUATION CONNECTÉE</div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
    <div class="input-group"><label>Nom de l'élève</label><input type="text" id="name" placeholder="Prénom Nom"></div>
    <div class="input-group"><label>Niveau</label><select id="level"><option>1ère BAC - Sciences</option><option>CRMEF / ENS</option></select></div>
  </div>

  <div class="input-group"><label>Sujet d'expression écrite</label><textarea id="sujet" rows="3" placeholder="Collez le sujet ici..."></textarea></div>
  <div class="input-group"><label>Votre rédaction</label><textarea id="texte" class="writing-paper" placeholder="Rédigez ici..."></textarea></div>

  <button class="btn-submit" id="go" onclick="analyser()">VALIDER ET GÉNÉRER L'EXPERTISE</button>

  <div id="reportSection">
    <div class="score-banner">
      <div id="resName" style="font-size: 20px; font-weight: 800;">CANDIDAT</div>
      <div id="resScore" style="font-size: 32px; font-weight: 800; background: var(--primary); padding: 5px 15px; border-radius: 10px;">--/10</div>
    </div>

    <div class="card"><h3>Transcription & Erreurs</h3><div id="outTranscription"></div></div>
    <div class="card"><h3>Bilan Pédagogique</h3><div id="outBilan"></div></div>
    <div class="card"><h3>Tableau des Corrections</h3><div id="outTableau"></div></div>
    <div class="card"><h3>Optimisation des phrases</h3><div id="outReform"></div></div>

    <div class="card" id="modelCard">
      <h3>Texte Modèle Optimisé</h3>
      <div id="navOpinion" class="tab-nav" style="display:none;">
        <button class="tab-btn active" id="btnS" onclick="showModel('S')">PLAN SIMPLE</button>
        <button class="tab-btn" id="btnD" onclick="showModel('D')">PLAN DIALECTIQUE</button>
      </div>
      <div id="outModel"></div>
    </div>
  </div>
</div>

<script>
  let modelSimple = "", modelDialectique = "", modelAnalytique = "";

  function showModel(type) {
    const out = document.getElementById('outModel');
    document.getElementById('btnS')?.classList.toggle('active', type === 'S');
    document.getElementById('btnD')?.classList.toggle('active', type === 'D');
    if(type === 'S') out.innerHTML = marked.parse(modelSimple);
    if(type === 'D') out.innerHTML = marked.parse(modelDialectique);
  }

  async function analyser() {
    const btn = document.getElementById('go');
    const name = document.getElementById('name').value;
    const sujet = document.getElementById('sujet').value;
    const texte = document.getElementById('texte').value;
    if(!sujet || !texte) return alert("Champs vides !");

    btn.disabled = true; btn.innerText = "EXPERTISE EN COURS...";
    document.getElementById('reportSection').style.display = "block";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: `ELEVE: ${name}\nSUJET: ${sujet}\nTEXTE: ${texte}` })
      });
      const data = await res.json();
      const raw = data.result;

      document.getElementById('resName').innerText = name.toUpperCase();
      const score = raw.match(/(\d+(?:\.\d+)?)\/10/);
      if(score) document.getElementById('resScore').innerText = score[0];

      // Découpage
      const getSection = (start, end) => raw.split(start)[1]?.split(end)[0] || "";
      
      document.getElementById('outBilan').innerHTML = marked.parse(getSection("[SECTION_BILAN]", "[SECTION_TRANSCRIPTION]"));
      document.getElementById('outTranscription').innerHTML = getSection("[SECTION_TRANSCRIPTION]", "[SECTION_TABLEAU]").replace(/\n/g, '<br>');
      document.getElementById('outTableau').innerHTML = marked.parse(getSection("[SECTION_TABLEAU]", "[SECTION_REFORMULATION]"));
      document.getElementById('outReform').innerHTML = marked.parse(getSection("[SECTION_REFORMULATION]", "[SECTION_MODELES]"));

      if(raw.includes("[PLAN_ANALYTIQUE]")) {
        document.getElementById('navOpinion').style.display = "none";
        document.getElementById('outModel').innerHTML = marked.parse(raw.split("[PLAN_ANALYTIQUE]")[1]);
      } else {
        document.getElementById('navOpinion').style.display = "flex";
        modelSimple = raw.split("[PLAN_SIMPLE]")[1]?.split("[PLAN_DIALECTIQUE]")[0];
        modelDialectique = raw.split("[PLAN_DIALECTIQUE]")[1];
        showModel('S');
      }
      
      window.scrollTo({ top: document.getElementById('reportSection').offsetTop, behavior: 'smooth' });
    } catch (e) { alert("Erreur serveur"); }
    btn.disabled = false; btn.innerText = "VALIDER ET GÉNÉRER L'EXPERTISE";
  }
</script>
</body>
</html>
