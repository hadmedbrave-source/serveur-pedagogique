<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expertise Production Écrite | Centre Al Akhawayn</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    :root { --primary: #c5221f; --navy: #0b1528; --bg: #f1f5f9; }
    body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; display: flex; justify-content: center; }
    .main-wrapper { max-width: 1000px; width: 100%; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 40px; border: 1px solid #e2e8f0; }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f1f5f9; padding-bottom: 20px; margin-bottom: 30px; }
    .brand { font-family: 'Outfit'; font-size: 26px; font-weight: 800; color: var(--primary); }
    .brand span { color: var(--navy); }

    .zone-card { border-radius: 12px; margin-bottom: 20px; border: 1.5px solid #e2e8f0; overflow: hidden; }
    .zone-head { padding: 12px 20px; font-weight: 700; font-size: 13px; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: var(--navy); }
    
    input, textarea, select { width: 100%; padding: 15px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 15px; }
    .writing-area { min-height: 400px; line-height: 28px; background-attachment: local; background-image: linear-gradient(to bottom, transparent 27px, #e2e8f0 27px); background-size: 100% 28px; border: none; }

    .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 20px; font-size: 16px; font-weight: 800; font-family: 'Outfit'; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .btn-main:hover { background: #a01a18; transform: translateY(-2px); }

    /* Dashboard Rapport */
    #reportSection { display: none; margin-top: 40px; }
    .report-card { border: 2px solid var(--navy); border-radius: 15px; padding: 30px; background: white; }
    .report-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 20px; }
    .final-score { background: var(--navy); color: white; padding: 15px 25px; border-radius: 10px; font-size: 30px; font-weight: 800; font-family: 'Outfit'; }
    
    .error-highlight { color: #dc2626; font-weight: 800; text-decoration: underline; }
    .connector-bold { color: #000; font-weight: 800; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; }

    .tab-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .tab-btn { padding: 12px 20px; border: 2px solid #e2e8f0; border-bottom: none; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 700; background: #f8fafc; }
    .tab-btn.active { background: #f0fdf4; border-color: #16a34a; color: #16a34a; }
    .tab-content { display: none; background: #f0fdf4; padding: 25px; border: 2px solid #16a34a; border-radius: 0 10px 10px 10px; line-height: 1.8; }
    .tab-content.active { display: block; }
    
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th { background: var(--navy); color: white; padding: 10px; text-align: left; }
    td { border: 1px solid #e2e8f0; padding: 10px; }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header">
    <div class="brand">CENTRE <span>AL AKHAWAYN</span></div>
    <div style="text-align:right; font-size:12px; font-weight:700; color:var(--navy);">EXPERTISE ÉCRITE BAC</div>
  </div>

  <div class="zone-card">
    <div class="zone-head">1) Identification</div>
    <div style="padding:20px; display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
      <input type="text" id="studentName" placeholder="Nom de l'élève">
      <select id="studentLevel"><option>1ère BAC - Sciences</option><option>Prépa Concours</option></select>
    </div>
  </div>

  <div class="zone-card">
    <div class="zone-head">2) Sujet</div>
    <div style="padding:20px;"><textarea id="sujet" rows="3" placeholder="Collez le sujet ici..."></textarea></div>
  </div>

  <div class="zone-card" style="border-color:var(--navy);">
    <div class="zone-head" style="background:var(--navy); color:white;">3) Production (Max 25 lignes)</div>
    <textarea id="texte" class="writing-area" placeholder="Rédigez ici..."></textarea>
  </div>

  <button class="btn-main" id="btnValider" onclick="lancerAnalyse()">VALIDER L'EXPERTISE</button>

  <div id="reportSection">
    <div class="report-card">
      <div class="report-header">
        <div id="resInfo"><h2>CANDIDAT</h2></div>
        <div class="final-score" id="resScore">--/10</div>
      </div>
      <div id="bilanOutput"></div>
      
      <div id="tabsZone" style="display:none;">
        <div class="tab-buttons">
          <button id="t1" class="tab-btn active" onclick="showTab('simple')">PLAN SIMPLE</button>
          <button id="t2" class="tab-btn" onclick="showTab('dialectique')">PLAN DIALECTIQUE</button>
        </div>
        <div id="c1" class="tab-content active"></div>
        <div id="c2" class="tab-content"></div>
      </div>

      <div id="analytiqueZone" class="tab-content" style="display:none; margin-top:20px; border-radius:10px;"></div>
    </div>
  </div>
</div>

<script>
  function showTab(t) {
    document.getElementById('t1').classList.toggle('active', t==='simple');
    document.getElementById('t2').classList.toggle('active', t==='dialectique');
    document.getElementById('c1').classList.toggle('active', t==='simple');
    document.getElementById('c2').classList.toggle('active', t==='dialectique');
  }

  async function lancerAnalyse() {
    const nom = document.getElementById('studentName').value || "Candidat";
    const sujet = document.getElementById('sujet').value;
    const texte = document.getElementById('texte').value;
    if(!sujet || !texte) return alert("Champs obligatoires.");

    document.getElementById('btnValider').innerText = "ANALYSE EN COURS...";
    document.getElementById('reportSection').style.display = "block";
    document.getElementById('bilanOutput').innerHTML = "L'IA examine votre travail...";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ prompt: `NOM: ${nom}\nSUJET: ${sujet}\nTEXTE: ${texte}` })
      });
      const data = await response.json();
      const raw = data.result;

      document.getElementById('resInfo').innerHTML = `<h2>${nom.toUpperCase()}</h2>`;
      const score = raw.match(/(\d+(?:\.\d+)?)\/10/);
      if(score) document.getElementById('resScore').innerText = score[0];

      const parts = raw.split(/\[PLAN_SIMPLE\]|\[PLAN_DIALECTIQUE\]|\[PLAN_ANALYTIQUE\]/);
      document.getElementById('bilanOutput').innerHTML = marked.parse(parts[0].replace("[BILAN_PEDAGOGIQUE]", ""));

      if(raw.includes("[PLAN_SIMPLE]")) {
        document.getElementById('tabsZone').style.display = "block";
        document.getElementById('analytiqueZone').style.display = "none";
        document.getElementById('c1').innerHTML = marked.parse(raw.split("[PLAN_SIMPLE]")[1].split("[PLAN_DIALECTIQUE]")[0]);
        document.getElementById('c2').innerHTML = marked.parse(raw.split("[PLAN_DIALECTIQUE]")[1]);
      } else if(raw.includes("[PLAN_ANALYTIQUE]")) {
        document.getElementById('tabsZone').style.display = "none";
        document.getElementById('analytiqueZone').style.display = "block";
        document.getElementById('analytiqueZone').innerHTML = marked.parse(raw.split("[PLAN_ANALYTIQUE]")[1]);
      }
    } catch (e) { document.getElementById('bilanOutput').innerHTML = "Erreur de connexion."; }
    document.getElementById('btnValider').innerText = "VALIDER L'EXPERTISE";
  }
</script>
</body>
</html>
