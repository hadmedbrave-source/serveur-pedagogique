<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expertise Production Écrite | Centre Al Akhawayn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

  <style>
    :root {
      --primary: #c5221f;
      --primary-dark: #8e1513;
      --navy: #0b1528;
      --bg-page: #f1f5f9;
      --surface: #ffffff;
      --text: #1e293b;
      --error: #ef4444;
      --success: #10b981;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--navy);
      color: white;
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand h1 { font-family: 'Outfit', sans-serif; font-size: 24px; margin: 0; color: #fff; }
    .brand span { color: var(--primary); }

    /* Main Content */
    .content { padding: 30px; }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--navy);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
    }

    /* Inputs */
    textarea {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.3s;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(197, 34, 31, 0.1);
    }

    .sujet-box { background: #fffcf0; border-color: #fde68a; min-height: 80px; }
    
    .writing-area {
      min-height: 350px;
      background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
      background-size: 100% 28px;
      line-height: 28px;
      padding-top: 8px;
    }

    .btn-main {
      background: var(--primary);
      color: white;
      border: none;
      padding: 18px 30px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: 0.3s;
    }
    .btn-main:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-main:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Report Styles */
    #reportSection { display: none; margin-top: 40px; border-top: 3px solid var(--navy); padding-top: 30px; }
    
    .hors-sujet-alert {
      background: #fee2e2;
      color: #991b1b;
      padding: 20px;
      border-radius: 12px;
      border: 2px solid #ef4444;
      text-align: center;
      font-weight: 800;
      font-size: 20px;
      margin-bottom: 25px;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% {transform: translateX(0);}
      25% {transform: translateX(-10px);}
      75% {transform: translateX(10px);}
    }

    .transcription-box {
      background: #f8fafc;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      line-height: 2;
      font-size: 16px;
      white-space: pre-wrap;
    }

    /* Markdown Table Styling */
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th { background: var(--navy); color: white; padding: 12px; text-align: left; }
    td { border: 1px solid #e2e8f0; padding: 12px; }
    tr:nth-child(even) { background: #f8fafc; }

    .optimized-text {
      background: #f0fdf4;
      border-left: 5px solid #16a34a;
      padding: 25px;
      border-radius: 0 12px 12px 0;
    }

    .error-highlight { color: #ef4444; font-weight: bold; text-decoration: underline; }
    .connector-highlight { color: #000; font-weight: 800; background: #e2e8f0; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand">
      <h1>CENTRE <span>AL AKHAWAYN</span></h1>
      <p style="font-size: 12px; opacity: 0.8; margin-top: 5px;">Système d'Évaluation IA Haute Précision</p>
    </div>
    <div style="text-align: right;">
      <span style="background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; font-size: 13px;">Module : Production Écrite</span>
    </div>
  </div>

  <div class="content">
    <div class="section-title">1. Sujet de la rédaction</div>
    <textarea id="sujetInput" class="sujet-box" placeholder="Collez ici la consigne du sujet..."></textarea>

    <div class="section-title" style="margin-top: 25px;">2. Votre production</div>
    <textarea id="studentText" class="writing-area" placeholder="Commencez à rédiger ici..."></textarea>
    
    <button id="btnValider" class="btn-main" onclick="analyserCopie()">VALIDER ET GÉNÉRER LE RAPPORT D'EXPERTISE</button>

    <div id="reportSection">
      <!-- Le rapport généré par l'IA s'affichera ici -->
      <div id="resultOutput"></div>
    </div>
  </div>
</div>

<script>
  async function analyserCopie() {
    const sujet = document.getElementById('sujetInput').value.trim();
    const texte = document.getElementById('studentText').value.trim();
    const btn = document.getElementById('btnValider');
    const reportSection = document.getElementById('reportSection');
    const resultOutput = document.getElementById('resultOutput');

    if (!sujet || !texte) {
      alert("Veuillez remplir le sujet et votre texte.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Analyse en cours par l'IA...";
    reportSection.style.display = 'block';
    resultOutput.innerHTML = "<p style='text-align:center;'>Chargement de l'expertise pédagogique...</p>";

    // Construction du Prompt
    const prompt = `
    Agis en tant qu'examinateur du baccalauréat marocain.
    Sujet donné : "${sujet}"
    Texte de l'élève : "${texte}"

    Instructions de réponse (Format Markdown) :
    1. Vérifie si le texte est "Hors-Sujet". Si oui, commence par : <div class="hors-sujet-alert">⚠️ HORS-SUJET DÉTECTÉ - NOTE : 00/10</div> suivi d'une brève explication.
    
    2. Si le sujet est respecté, donne une note sur 10 basée sur : 
       - Respect de la consigne (2pts)
       - Cohérence (2pts)
       - Structure (2pts)
       - Langue (4pts)

    3. TRANSCRIPTION ANNOTÉE :
       Réécris le texte EXACT de l'élève. 
       - Entoure chaque erreur par : <span class="error-highlight">mot_erroné</span>
       - Entoure chaque lien logique/connecteur par : <b class="connector-highlight">connecteur</b>

    4. TABLEAU DES ERREURS :
       Crée un tableau Markdown : | Erreur | Type | Correction |

    5. REFORMULATIONS :
       Liste 3 à 5 phrases du texte qui sont faibles et propose une version optimisée.

    6. VERSION OPTIMISÉE (LE MODÈLE) :
       Détecte le type de plan nécessaire :
       - Si sujet d'opinion : utilise un Plan Dialectique (Thèse/Antithèse/Synthèse) ou Simple.
       - Si sujet Causes/Conséquences : utilise un Plan Analytique.
       Rédige le texte complet idéal.
    `;

    try {
      const response = await fetch('/api/chat', { // Remplacez par votre endpoint API réel
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });

      const data = await response.json();
      
      // Conversion Markdown vers HTML
      resultOutput.innerHTML = marked.parse(data.result);
      
      // Scroll vers le rapport
      reportSection.scrollIntoView({ behavior: 'smooth' });

    } catch (error) {
      resultOutput.innerHTML = "<p style='color:red;'>Erreur lors de la connexion à l'IA. Vérifiez votre configuration API.</p>";
    } finally {
      btn.disabled = false;
      btn.textContent = "VALIDER ET GÉNÉRER LE RAPPORT D'EXPERTISE";
    }
  }
</script>

</body>
</html>
