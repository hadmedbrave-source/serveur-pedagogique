<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expertise Production Écrite | Centre Al Akhawayn</title>
  
  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bibliothèque de rendu Markdown (Lien stable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>

  <style>
    :root {
      --primary: #c5221f;
      --primary-dark: #8e1513;
      --navy: #0b1528;
      --bg-page: #f1f5f9;
      --surface: #ffffff;
      --text: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-page);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .main-wrapper {
      max-width: 1000px;
      width: 100%;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(11, 21, 40, 0.1);
      padding: 40px;
      border: 1px solid #e2e8f0;
    }

    .header-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 30px;
      border-bottom: 3px solid #f1f5f9;
    }

    .brand-title { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; color: var(--primary); }
    .brand-title span { color: var(--navy); }
    .badge-status { background: var(--navy); color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 5px; display: inline-block; }

    .zone-card { border-radius: 14px; margin-bottom: 24px; border: 1.5px solid #e2e8f0; overflow: hidden; background: white; }
    .zone-head { padding: 12px 20px; font-weight: 700; font-size: 13px; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: var(--navy); }
    .zone-body { padding: 20px; }

    .student-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
    input, select, textarea {
      width: 100%; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 14px; outline: none; transition: 0.2s; font-family: inherit;
    }

    .writing-area {
      width: 100%; min-height: 450px; line-height: 28px; font-size: 16px; padding: 10px 15px; border: none; outline: none; resize: vertical;
      background-attachment: local;
      background-image: linear-gradient(to bottom, transparent 27px, #e2e8f0 27px);
      background-size: 100% 28px;
    }

    .stats-bar { padding: 12px 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #64748b; }

    .btn-evaluate {
      width: 100%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white; border: none; padding: 20px; font-size: 17px; font-weight: 800;
      font-family: 'Outfit'; border-radius: 12px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
    }

    .btn-evaluate:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(197, 34, 31, 0.3); }
    .btn-evaluate:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Dashboard Rapport */
    #reportSection { display: none; margin-top: 40px; border-top: 3px solid var(--navy); padding-top: 30px; }
    .report-card-ui { background: white; border: 1px solid #e2e8f0; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    
    .report-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 20px; }
    .student-tag h2 { font-family: 'Outfit'; color: var(--navy); text-transform: uppercase; font-size: 24px; margin: 0; }
    .final-score-badge { background: var(--navy); color: white; padding: 15px 25px; border-radius: 10px; font-size: 32px; font-weight: 800; font-family: 'Outfit'; }

    .hors-sujet-alert {
      background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 25px;
      border-radius: 12px; text-align: center; font-weight: 800; font-size: 18px; margin-bottom: 25px;
    }

    .error-highlight { color: #dc2626; font-weight: 800; text-decoration: underline; }
    .connector-bold { color: #000; font-weight: 800; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; }

    /* Onglets */
    .tab-container { margin-top: 30px; }
    .tab-buttons { display: flex; gap: 10px; margin-bottom: -2px; }
    .tab-btn { padding: 12px 25px; border: 2px solid #e2e8f0; border-bottom: none; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 700; background: #f8fafc; color: #64748b; transition: 0.3s; }
    .tab-btn.active { background: #f0fdf4; border-color: #16a34a; color: #16a34a; z-index: 2; }
    .tab-content { display: none; background: #f0fdf4; padding: 25px; border: 2px solid #16a34a; border-radius: 0 10px 10px 10px; line-height: 1.8; }
    .tab-content.active { display: block; }
    
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th { background: var(--navy); color: white; padding: 12px; text-align: left; }
    td { border: 1px solid #e2e8f0; padding: 12px; font-size: 14px; }

    @media (max-width: 768px) { .student-grid { grid-template-columns: 1fr; } .report-header-flex { flex-direction: column; text-align: center; gap: 20px; } }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header-banner">
    <div>
      <div class="brand-title">CENTRE <span>AL AKHAWAYN</span></div>
      <div class="badge-status">Plateforme Pédagogique Officielle</div>
    </div>
    <div style="text-align: right; font-weight: 700; font-size: 13px; color: var(--navy);">
      EXPERTISE BAC 1ÈRE ANNÉE<br><span style="color: var(--primary); font-size: 10px;">Propulsé par GPT-4o-mini</span>
    </div>
  </div>

  <div class="zone-card">
    <div class="zone-head">1) Identification du candidat</div>
    <div class="zone-body">
      <div class="student-grid">
        <input type="text" id="studentName" placeholder="Prénom et Nom">
        <select id="studentLevel">
          <option>1ère BAC - Sciences Expérimentales</option>
          <option>1ère BAC - Sciences Mathématiques</option>
          <option>1ère BAC - Lettres & Humaines</option>
          <option>Préparation Concours (CRMEF / ENS)</option>
        </select>
      </div>
    </div>
  </div>

  <div class="zone-card" style="border-left: 5px solid #f59e0b;">
    <div class="zone-head">2) Sujet d'expression écrite</div>
    <div class="zone-body">
      <textarea id="sujetInput" rows="3" placeholder="Saisissez ici la consigne complète..."></textarea>
    </div>
  </div>

  <div class="zone-card" style="border-color: var(--navy);">
    <div class="zone-head" style="background: var(--navy); color: white;">3) Production de l'élève (Max 25 lignes)</div>
    <div class="zone-body" style="padding: 0;">
      <textarea id="studentText" class="writing-area" oninput="actualiserCompteurs()" placeholder="Rédigez votre texte ici..."></textarea>
      <div class="stats-bar">
        <span id="lineInfo">Lignes utilisées : 0 / 25</span>
        <span id="wordInfo">Nombre de mots : 0</span>
      </div>
    </div>
  </div>

  <button class="btn-evaluate" id="btnValider" onclick="lancerEvaluationIA()">Valider et générer l'expertise</button>

  <div id="reportSection">
    <div class="report-card-ui">
      <div class="report-header-flex">
        <div class="student-tag">
          <h2 id="resStudentName">CANDIDAT</h2>
          <p id="resStudentLevel" style="color:#64748b; font-weight:600; font-size:12px; margin-top:5px;"></p>
        </div>
        <div class="final-score-badge" id="resScore">--/10</div>
      </div>

      <div id="bilanOutput"></div>

      <!-- Zone Modèles -->
      <div id="opinionZone" class="tab-container" style="display:none;">
        <div class="tab-buttons">
          <button id="tabSimple" class="tab-btn active" onclick="switchTab('simple')">PLAN SIMPLE</button>
          <button id="tabDialectique" class="tab-btn" onclick="switchTab('dialectique')">PLAN DIALECTIQUE</button>
        </div>
        <div id="contentSimple" class="tab-content active"></div>
        <div id="contentDialectique" class="tab-content"></div>
      </div>

      <div id="analyticalZone" class="tab-container" style="display:none;">
        <div id="contentAnalytique" class="tab-content active" style="border-radius:10px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function actualiserCompteurs() {
    const text = document.getElementById('studentText').value;
    const lines = text.split('\n').length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('lineInfo').textContent = `Lignes utilisées : ${lines} / 25`;
    document.getElementById('wordInfo').textContent = `Nombre de mots : ${words}`;
  }

  function switchTab(type) {
    document.getElementById('tabSimple').classList.toggle('active', type === 'simple');
    document.getElementById('tabDialectique').classList.toggle('active', type === 'dialectique');
    document.getElementById('contentSimple').classList.toggle('active', type === 'simple');
    document.getElementById('contentDialectique').classList.toggle('active', type === 'dialectique');
  }

  async function lancerEvaluationIA() {
    const nom = document.getElementById('studentName').value || "Candidat(e)";
    const niveau = document.getElementById('studentLevel').value;
    const sujet = document.getElementById('sujetInput').value.trim();
    const texte = document.getElementById('studentText').value.trim();
    const btn = document.getElementById('btnValider');
    
    if (!sujet || !texte) return alert("Sujet et texte obligatoires.");

    btn.disabled = true;
    btn.textContent = "ANALYSE EN COURS...";
    document.getElementById('reportSection').style.display = 'block';
    document.getElementById('bilanOutput').innerHTML = "<p style='text-align:center;'>L'IA examine votre copie...</p>";

    try {
      const response = await fetch("/api/chat", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: `ÉLÈVE: ${nom}\nSUJET: ${sujet}\nTEXTE: ${texte}` })
      });

      const data = await response.json();
      const raw = data.result;

      document.getElementById('resStudentName').innerText = nom.toUpperCase();
      document.getElementById('resStudentLevel').innerText = niveau;

      if (raw.includes("HORS-SUJET")) {
        document.getElementById('bilanOutput').innerHTML = raw;
        document.getElementById('resScore').innerText = "00/10";
        document.getElementById('opinionZone').style.display = "none";
        document.getElementById('analyticalZone').style.display = "none";
      } else {
        const scoreMatch = raw.match(/(\d+(?:\.\d+)?)\/10/);
        if(scoreMatch) document.getElementById('resScore').innerText = scoreMatch[0];

        const parts = raw.split(/\[PLAN_SIMPLE\]|\[PLAN_DIALECTIQUE\]|\[PLAN_ANALYTIQUE\]/i);
        document.getElementById('bilanOutput').innerHTML = marked.parse(parts[0].replace("[BILAN_PEDAGOGIQUE]", ""));

        if (raw.includes("[PLAN_SIMPLE]")) {
          document.getElementById('opinionZone').style.display = "block";
          document.getElementById('analyticalZone').style.display = "none";
          document.getElementById('contentSimple').innerHTML = marked.parse(raw.split("[PLAN_SIMPLE]")[1].split("[PLAN_DIALECTIQUE]")[0]);
          document.getElementById('contentDialectique').innerHTML = marked.parse(raw.split("[PLAN_DIALECTIQUE]")[1]);
        } else if (raw.includes("[PLAN_ANALYTIQUE]")) {
          document.getElementById('opinionZone').style.display = "none";
          document.getElementById('analyticalZone').style.display = "block";
          document.getElementById('contentAnalytique').innerHTML = marked.parse(raw.split("[PLAN_ANALYTIQUE]")[1]);
        }
      }
      window.scrollTo({ top: document.getElementById('reportSection').offsetTop - 20, behavior: 'smooth' });

    } catch (error) {
      document.getElementById('bilanOutput').innerHTML = "<p style='color:red;'>Erreur de connexion.</p>";
    } finally {
      btn.disabled = false;
      btn.textContent = "Valider et générer l'expertise";
    }
  }
</script>
</body>
</html>
