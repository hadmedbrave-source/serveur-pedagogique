<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expertise Production Écrite | Centre Al Akhawayn</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bibliothèque indispensable pour transformer la réponse IA en texte structuré -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

  <style>
    :root {
      --primary: #c5221f;
      --primary-dark: #8e1513;
      --navy: #0b1528;
      --bg-page: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --line-height: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-page);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }

    .main-wrapper {
      max-width: 1000px;
      width: 100%;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(11, 21, 40, 0.1);
      padding: 40px;
      border: 1px solid #e2e8f0;
    }

    .header-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 30px;
      border-bottom: 3px solid #f1f5f9;
    }
    .brand-title { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; color: var(--primary); }
    .brand-title span { color: var(--navy); }
    .badge-status { background: var(--navy); color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 5px; display: inline-block; }

    .zone-card { border-radius: 14px; margin-bottom: 24px; border: 1.5px solid #e2e8f0; overflow: hidden; background: white; }
    .zone-head { padding: 12px 20px; font-weight: 700; font-size: 13px; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: var(--navy); }
    .zone-body { padding: 20px; }

    .student-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
    input, select, textarea {
      width: 100%; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 14px; outline: none; transition: 0.2s;
    }

    .writing-area {
      width: 100%; min-height: 450px; line-height: var(--line-height); font-size: 16px; padding: 0 15px; border: none; outline: none; resize: vertical;
      background-attachment: local;
      background-image: linear-gradient(to bottom, transparent calc(var(--line-height) - 1px), #e2e8f0 calc(var(--line-height) - 1px));
      background-size: 100% var(--line-height);
    }
    .stats-bar { padding: 12px 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #64748b; }

    .btn-evaluate {
      width: 100%; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white; border: none; padding: 20px; font-size: 17px; font-weight: 800;
      font-family: 'Outfit'; border-radius: 12px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
      box-shadow: 0 10px 20px rgba(197, 34, 31, 0.2);
    }
    .btn-evaluate:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(197, 34, 31, 0.3); }
    .btn-evaluate:disabled { background: #94a3b8; cursor: not-allowed; }

    #reportSection { display: none; margin-top: 40px; }
    .report-container { border: 2px solid var(--navy); border-radius: 12px; padding: 35px; background: white; line-height: 1.8; }
    
    /* Styles pour l'affichage des erreurs par l'IA */
    .hors-sujet-alert {
      background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 25px;
      border-radius: 12px; text-align: center; font-weight: 800; font-size: 18px; margin-bottom: 25px;
    }
    .error-highlight { color: #dc2626; font-weight: 800; text-decoration: underline; }
    .connector-bold { color: #000; font-weight: 800; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin: 25px 0; }
    th { background: var(--navy); color: white; padding: 14px; text-align: left; }
    td { border: 1px solid #e2e8f0; padding: 14px; font-size: 14px; }
    tr:nth-child(even) { background: #f8fafc; }

    @media (max-width: 768px) { .student-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header-banner">
    <div>
      <div class="brand-title">CENTRE <span>AL AKHAWAYN</span></div>
      <div class="badge-status">Expertise Pédagogique GPT-4o-mini</div>
    </div>
    <div style="text-align: right; font-weight: 700; font-size: 14px; color: var(--navy);">
      EXPERTISE ÉCRITE<br><span style="color: var(--primary); font-size: 11px;">Moteur de correction d'excellence</span>
    </div>
  </div>

  <div class="zone-card">
    <div class="zone-head">1) Identification</div>
    <div class="zone-body">
      <div class="student-grid">
        <div>
          <label>Candidat</label>
          <input type="text" id="studentName" placeholder="Prénom et Nom">
        </div>
        <div>
          <label>Niveau / Concours</label>
          <select id="studentLevel">
            <option>1ère BAC - Sciences Expérimentales</option>
            <option>1ère BAC - Sciences Mathématiques</option>
            <option>1ère BAC - Lettres & Humaines</option>
            <option>Préparation Concours (CRMEF / ENS)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="zone-card" style="border-left: 5px solid #f59e0b;">
    <div class="zone-head">2) Sujet d'expression écrite</div>
    <div class="zone-body">
      <textarea id="sujetInput" rows="3" placeholder="Collez ici la consigne complète du sujet..."></textarea>
    </div>
  </div>

  <div class="zone-card" style="border-color: var(--navy);">
    <div class="zone-head" style="background: var(--navy); color: white;">3) Production de l'élève (Max 25 lignes)</div>
    <div class="zone-body" style="padding: 0;">
      <textarea id="studentText" class="writing-area" oninput="actualiserCompteurs()" placeholder="Rédigez votre texte ici..."></textarea>
      <div class="stats-bar">
        <span id="lineInfo">Lignes utilisées : 0 / 25</span>
        <span id="wordInfo">Nombre de mots : 0</span>
      </div>
    </div>
  </div>

  <button class="btn-evaluate" id="btnValider" onclick="lancerEvaluationIA()">Générer le rapport d'expertise</button>

  <div id="reportSection">
    <div class="report-container" id="resultatIA"></div>
  </div>
</div>

<script>
  // --- CONFIGURATION CRUCIALE ---
  // On utilise une route relative pour éviter toute erreur de connexion (CORS)
  const RAILWAY_BACKEND = "/api/chat";

  function actualiserCompteurs() {
    const text = document.getElementById('studentText').value;
    const lines = text.split('\n').length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    const lineInfo = document.getElementById('lineInfo');
    
    lineInfo.textContent = `Lignes utilisées : ${lines} / 25`;
    lineInfo.style.color = lines > 25 ? "var(--primary)" : "#64748b";
    document.getElementById('wordInfo').textContent = `Nombre de mots : ${words}`;
  }

  async function lancerEvaluationIA() {
    const nom = document.getElementById('studentName').value || "Candidat(e)";
    const sujet = document.getElementById('sujetInput').value.trim();
    const texte = document.getElementById('studentText').value.trim();
    const btn = document.getElementById('btnValider');
    const output = document.getElementById('resultatIA');
    const reportSection = document.getElementById('reportSection');

    if (!sujet || !texte) return alert("Sujet et rédaction obligatoires.");

    btn.disabled = true;
    btn.textContent = "Expertise en cours par GPT-4o-mini...";
    reportSection.style.display = 'block';
    output.innerHTML = "<div style='text-align:center; padding: 40px;'>L'IA analyse votre copie (Vérification du sujet, correction de la langue et structure du plan)...</div>";

    try {
      const response = await fetch(RAILWAY_BACKEND, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: `ÉLÈVE: ${nom}\nSUJET: ${sujet}\nTEXTE: ${texte}` })
      });

      const data = await response.json();
      
      if (response.ok) {
        output.innerHTML = marked.parse(data.result);
        window.scrollTo({ top: reportSection.offsetTop - 20, behavior: 'smooth' });
      } else {
        output.innerHTML = `<p style="color:red; text-align:center; padding: 20px;">Erreur de l'IA : ${data.error}<br><small>${data.details || ""}</small></p>`;
      }
    } catch (error) {
      output.innerHTML = "<p style='color:red; text-align:center; padding: 20px;'>Erreur de connexion. Vérifiez que vous avez bien ouvert le site via son URL (https://...) et non localement.</p>";
    } finally {
      btn.disabled = false;
      btn.textContent = "Générer le rapport d'expertise";
    }
  }
</script>

</body>
</html>
