<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Évaluation Certifiée - Centre Al Akhawayn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

  <style>
    :root {
      --primary: #c5221f;
      --navy: #0b1528;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
    }

    body {
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      margin: 0;
      padding: 20px;
    }

    .main-container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* Header */
    .header-top {
      background: var(--navy);
      color: white;
      padding: 25px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-top h1 { font-family: 'Outfit', sans-serif; font-size: 22px; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
    .header-top h1 span { color: var(--primary); }
    .badge-status { background: var(--primary); color: white; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 700; }

    .content-padding { padding: 30px 40px; }

    /* Grille Info */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 6px; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 12px; font-family: inherit; font-size: 14px; box-sizing: border-box;
    }

    /* Sujet */
    .zone-sujet { background: #fffcf0; border: 1.5px solid #fde68a; margin-bottom: 25px; border-radius: 8px; padding: 15px; }
    
    /* Barème */
    .bareme-table {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 30px;
    }
    .bareme-item { background: #f1f5f9; padding: 10px; border-radius: 6px; font-size: 12px; display: flex; justify-content: space-between; border: 1px solid #cbd5e1; }
    .bareme-item b { color: var(--primary); }

    /* Zone Rédaction */
    .writing-container { border: 2px solid var(--navy); border-radius: 10px; overflow: hidden; }
    .writing-header { background: var(--navy); color: white; padding: 8px 15px; font-size: 12px; display: flex; justify-content: space-between; }
    .textarea-paper {
      min-height: 400px; line-height: 28px; background-attachment: local;
      background-image: linear-gradient(to bottom, transparent 27px, #e2e8f0 27px);
      background-size: 100% 28px; border: none; outline: none; padding: 10px 15px; resize: vertical;
    }
    .stats-footer { background: #f8fafc; padding: 10px 15px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }

    .btn-submit {
      width: 100%; background: var(--primary); color: white; border: none; padding: 18px; font-family: 'Outfit'; 
      font-weight: 800; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 25px; transition: 0.2s;
    }
    .btn-submit:hover { background: #a01a18; transform: translateY(-2px); }

    /* Styles Rapport IA */
    #reportSection { display: none; margin-top: 40px; padding: 30px; border-top: 3px dashed var(--navy); }
    .hors-sujet-alert { background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 20px; border-radius: 8px; text-align: center; font-weight: 800; font-size: 18px; margin-bottom: 20px; }
    
    .annotated-text { background: #f1f5f9; padding: 25px; border-radius: 8px; line-height: 2.2; font-size: 15px; border: 1px solid #cbd5e1; }
    .error-highlight { color: #dc2626; font-weight: 800; text-decoration: underline; }
    .connector-bold { color: #000; font-weight: 800; background: #e2e8f0; padding: 2px 4px; border-radius: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th { background: var(--navy); color: white; padding: 10px; text-align: left; font-size: 13px; }
    td { border: 1px solid #e2e8f0; padding: 10px; font-size: 14px; }
    
    .optimized-box { background: #f0fdf4; border-left: 5px solid #16a34a; padding: 25px; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>

<div class="main-container">
  <div class="header-top">
    <div>
      <h1>CENTRE <span>AL AKHAWAYN</span></h1>
      <div style="font-size: 11px; margin-top: 4px; font-weight: 600; opacity: 0.8;">Expertise & Préparation aux Concours</div>
    </div>
    <div class="badge-status">PLATEFORME PÉDAGOGIQUE OFFICIELLE</div>
  </div>

  <div class="content-padding">
    <div class="info-grid">
      <div>
        <label>Nom & Prénom</label>
        <input type="text" id="studentName" placeholder="Ex: Karim Benjelloun">
      </div>
      <div>
        <label>Niveau Scolaire</label>
        <select id="studentLevel">
          <option>1ère BAC - Sciences Expérimentales</option>
          <option>1ère BAC - Sciences Mathématiques</option>
          <option>CRMEF / ENS (Prépa Concours)</option>
        </select>
      </div>
    </div>

    <div class="zone-sujet">
      <label style="color: #b45309;">1) Sujet de l'épreuve</label>
      <textarea id="sujetInput" rows="3" placeholder="Saisissez la consigne complète ici (ex: causes, conséquences, opinion...)"></textarea>
    </div>

    <label>2) Barème de notation (Total 10 pts)</label>
    <div class="bareme-table">
      <div class="bareme-item">Consigne <b>2.0</b></div>
      <div class="bareme-item">Structure <b>2.0</b></div>
      <div class="bareme-item">Arguments <b>2.0</b></div>
      <div class="bareme-item">Langue <b>2.5</b></div>
      <div class="bareme-item">Lexique <b>1.5</b></div>
    </div>

    <div class="writing-container">
      <div class="writing-header">
        <span>3) ZONE DE PRODUCTION ÉCRITE</span>
        <span>25 LIGNES MAXIMUM</span>
      </div>
      <textarea id="studentText" class="textarea-paper" oninput="updateStats()"></textarea>
      <div class="stats-footer">
        <span id="lineCount">Lignes : 0 / 25</span>
        <span id="wordCount">Mots : 0</span>
      </div>
    </div>

    <button class="btn-submit" id="btnAnalyze" onclick="lancerIA()">VALIDER ET GÉNÉRER LE RAPPORT CERTIFIÉ</button>

    <div id="reportSection">
      <div id="iaOutput"></div>
    </div>
  </div>
</div>

<script>
  function updateStats() {
    const text = document.getElementById('studentText').value;
    const lines = text.split('\n').length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('lineCount').innerText = `Lignes : ${lines} / 25`;
    document.getElementById('wordCount').innerText = `Mots : ${words}`;
  }

  async function lancerIA() {
    const sujet = document.getElementById('sujetInput').value;
    const texte = document.getElementById('studentText').value;
    const btn = document.getElementById('btnAnalyze');
    const output = document.getElementById('iaOutput');
    const report = document.getElementById('reportSection');

    if(!sujet || !texte) return alert("Veuillez remplir le sujet et le texte.");

    btn.disabled = true;
    btn.innerText = "ANALYSE EXPERTE EN COURS...";
    report.style.display = 'block';
    output.innerHTML = "<div style='text-align:center;'>Analyse rigoureuse de la copie...</div>";

    const prompt = `
    En tant que correcteur officiel du baccalauréat :
    Sujet : ${sujet}
    Copie élève : ${texte}

    FORMAT DE RÉPONSE ATTENDU (STRICT) :
    1. Si hors-sujet : <div class="hors-sujet-alert">HORS-SUJET : NOTE 0/10</div> explication brève.
    2. Sinon, Tableau de notation /10 selon le barème fourni.
    3. TRANSCRIPTION : Réécris le texte de l'élève. Entoure les erreurs par <span class="error-highlight">...</span> et les connecteurs logiques par <b class="connector-bold">...</b>.
    4. TABLEAU DES CORRECTIONS : | Erreur | Nature | Correction |
    5. REFORMULATIONS : 3 phrases optimisées.
    6. MODÈLE D'EXCELLENCE : Produis un texte parfait. Choisis le plan selon le sujet :
       - Si opinion : Plan Dialectique ou Simple.
       - Si causes/conséquences : Plan Analytique.
    `;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ prompt: prompt })
      });
      const data = await response.json();
      output.innerHTML = marked.parse(data.result);
    } catch (e) {
      output.innerHTML = "Erreur de connexion avec l'IA.";
    } finally {
      btn.disabled = false;
      btn.innerText = "VALIDER ET GÉNÉRER LE RAPPORT CERTIFIÉ";
    }
  }
</script>

</body>
</html>
