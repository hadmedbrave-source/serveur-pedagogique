<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Évaluation Interactive - Production Écrite | Centre Al Akhawayn</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bibliothèque pour transformer le texte de l'IA en joli HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>

  <style>
    :root {
      --primary: #c5221f;
      --primary-dark: #8e1513;
      --navy: #0b1528;
      --bg-page: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --line-height: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-page);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      line-height: 1.6;
    }

    .main-wrapper {
      max-width: 1000px;
      width: 100%;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      border: 1px solid #e2e8f0;
    }

    /* --- HEADER --- */
    .header-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 30px;
      border-bottom: 3px solid #f1f5f9;
    }
    .brand-title { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 800; color: var(--primary); }
    .brand-title span { color: var(--navy); }
    .badge-status { background: var(--navy); color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 5px; display: inline-block; }

    /* --- FORMULAIRE --- */
    .zone-card { border-radius: 14px; margin-bottom: 24px; border: 1.5px solid #e2e8f0; overflow: hidden; }
    .zone-head { padding: 12px 20px; font-weight: 700; font-size: 13px; text-transform: uppercase; background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: var(--navy); }
    .zone-body { padding: 20px; }

    .student-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 8px; }
    input, select, textarea {
      width: 100%; border: 1.5px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 14px; outline: none; transition: 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(197, 34, 31, 0.1); }

    /* --- ZONE RÉDACTION (Papier) --- */
    .writing-area {
      width: 100%; min-height: 450px; line-height: var(--line-height); font-size: 15px; padding: 0 15px; border: none; outline: none; resize: vertical;
      background-attachment: local;
      background-image: linear-gradient(to bottom, transparent calc(var(--line-height) - 1px), #e2e8f0 calc(var(--line-height) - 1px));
      background-size: 100% var(--line-height);
    }
    .stats-bar { padding: 10px 20px; background: #f1f5f9; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #475569; }

    /* --- BOUTON --- */
    .btn-evaluate {
      width: 100%; background: var(--primary); color: white; border: none; padding: 20px; font-size: 17px; font-weight: 800;
      font-family: 'Outfit'; border-radius: 12px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
    }
    .btn-evaluate:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-evaluate:disabled { background: #94a3b8; cursor: not-allowed; }

    /* --- RAPPORT IA (Stylisé) --- */
    #reportSection { display: none; margin-top: 40px; }
    .report-container { border: 2px solid var(--navy); border-radius: 12px; padding: 30px; background: white; }
    
    /* Styles injectés pour le texte de l'IA */
    .hors-sujet-alert {
      background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; padding: 20px;
      border-radius: 10px; text-align: center; font-weight: 800; font-size: 20px; margin-bottom: 20px;
    }
    .error-highlight { color: #dc2626; font-weight: 800; text-decoration: underline; }
    .connector-bold { color: #000; font-weight: 800; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th { background: var(--navy); color: white; padding: 12px; text-align: left; }
    td { border: 1px solid #e2e8f0; padding: 12px; font-size: 14px; }
    tr:nth-child(even) { background: #f8fafc; }

    .optimized-box { background: #f0fdf4; border-left: 5px solid #16a34a; padding: 20px; margin-top: 20px; border-radius: 4px; }

    @media (max-width: 768px) { .student-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="header-banner">
    <div>
      <div class="brand-title">CENTRE <span>AL AKHAWAYN</span></div>
      <div class="badge-status">Plateforme Pédagogique Officielle</div>
    </div>
    <div style="text-align: right; font-weight: 700; font-size: 14px; color: var(--navy);">
      PRODUCTION ÉCRITE<br><span style="color: var(--primary); font-size: 11px;">Moteur Anti-Hors-Sujet</span>
    </div>
  </div>

  <!-- Infos Candidat -->
  <div class="zone-card">
    <div class="zone-head">1) Identification du candidat</div>
    <div class="zone-body">
      <div class="student-grid">
        <div>
          <label>Nom et Prénom</label>
          <input type="text" id="studentName" placeholder="Ex: Karim Benjelloun">
        </div>
        <div>
          <label>Niveau Scolaire</label>
          <select id="studentLevel">
            <option>1ère BAC - Sciences Expérimentales</option>
            <option>1ère BAC - Sciences Mathématiques</option>
            <option>1ère BAC - Lettres</option>
            <option>Prépa Concours Enseignement</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Sujet -->
  <div class="zone-card">
    <div class="zone-head" style="color: #b45309;">2) Sujet d'expression écrite</div>
    <div class="zone-body">
      <textarea id="sujetInput" rows="3" placeholder="Saisissez ici la consigne complète..."></textarea>
    </div>
  </div>

  <!-- Zone de rédaction -->
  <div class="zone-card" style="border-color: var(--navy);">
    <div class="zone-head" style="background: var(--navy); color: white;">3) Zone de rédaction (Copie d'examen)</div>
    <div class="zone-body" style="padding: 0;">
      <textarea id="studentText" class="writing-area" oninput="actualiserCompteurs()" placeholder="Rédigez votre texte ici..."></textarea>
      <div class="stats-bar">
        <span id="lineInfo">Lignes : 0 / 25</span>
        <span id="wordInfo">Mots : 0</span>
      </div>
    </div>
  </div>

  <button class="btn-evaluate" id="btnValider" onclick="lancerEvaluationIA()">Générer le rapport d'expertise pédagogique</button>

  <!-- Rapport Final -->
  <div id="reportSection">
    <div class="report-container" id="resultatIA">
      <!-- Le contenu généré par l'IA s'affichera ici -->
    </div>
  </div>

</div>

<script>
  // --- CONFIGURATION ---
  // REMPLACEZ CETTE URL PAR VOTRE URL RAILWAY RÉELLE
  const RAILWAY_URL = "https://votre-projet.up.railway.app/api/chat";

  function actualiserCompteurs() {
    const text = document.getElementById('studentText').value;
    const lines = text.split('\n').length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    
    const lineInfo = document.getElementById('lineInfo');
    lineInfo.textContent = `Lignes : ${lines} / 25`;
    lineInfo.style.color = lines > 25 ? "red" : "#475569";
    
    document.getElementById('wordInfo').textContent = `Mots : ${words}`;
  }

  async function lancerEvaluationIA() {
    const nom = document.getElementById('studentName').value || "Candidat";
    const sujet = document.getElementById('sujetInput').value.trim();
    const texte = document.getElementById('studentText').value.trim();
    const btn = document.getElementById('btnValider');
    const output = document.getElementById('resultatIA');
    const reportSection = document.getElementById('reportSection');

    if (!sujet || !texte) {
      alert("Veuillez remplir le sujet et votre texte avant de valider.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Analyse en cours par l'IA d'excellence...";
    reportSection.style.display = 'block';
    output.innerHTML = "<p style='text-align:center; padding: 40px;'>L'IA examine votre copie (vérification du sujet, de la langue et des arguments)...</p>";

    // Préparation du message pour l'IA
    const promptComplet = `
    ÉVALUATION POUR : ${nom}
    SUJET : ${sujet}
    TEXTE ÉLÈVE : ${texte}
    `;

    try {
      const response = await fetch(RAILWAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: promptComplet })
      });

      const data = await response.json();
      
      if (response.ok) {
        // Transformation du Markdown en HTML
        output.innerHTML = marked.parse(data.result);
        window.scrollTo({ top: reportSection.offsetTop, behavior: 'smooth' });
      } else {
        output.innerHTML = `<p style="color:red;">Erreur : ${data.error}</p>`;
      }
    } catch (error) {
      output.innerHTML = "<p style='color:red;'>Impossible de contacter le serveur. Vérifiez que votre serveur Railway est actif.</p>";
    } finally {
      btn.disabled = false;
      btn.textContent = "Générer le rapport d'expertise pédagogique";
    }
  }
</script>

</body>
</html>
