<script>
  // UTILISEZ L'URL COMPLÈTE DE RAILWAY ICI :
  const RAILWAY_BACKEND = "https://serveur-pedagogique-production.up.railway.app/api/chat";

  async function lancerEvaluationIA() {
    const nom = document.getElementById('studentName').value || "Candidat(e)";
    const sujet = document.getElementById('sujetInput').value.trim();
    const texte = document.getElementById('studentText').value.trim();
    const btn = document.getElementById('btnValider');
    const output = document.getElementById('resultatIA');
    const reportSection = document.getElementById('reportSection');

    if (!sujet || !texte) return alert("Sujet et texte obligatoires.");

    btn.disabled = true;
    btn.textContent = "Analyse en cours...";
    reportSection.style.display = 'block';
    output.innerHTML = "<div style='text-align:center; padding: 40px;'>Connexion au serveur pédagogique...</div>";

    try {
      const response = await fetch(RAILWAY_BACKEND, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: `ÉLÈVE: ${nom}\nSUJET: ${sujet}\nTEXTE: ${texte}` })
      });

      const data = await response.json();
      
      if (response.ok) {
        output.innerHTML = marked.parse(data.result);
      } else {
        output.innerHTML = `<p style="color:red;">Erreur IA : ${data.error}</p>`;
      }
    } catch (error) {
      output.innerHTML = `<p style="color:red; text-align:center;">
        <b>Erreur de connexion.</b><br>
        Vérifiez que votre crédit OpenAI (5$) est actif et que le domaine est autorisé.<br>
        <small>Détail : ${error.message}</small>
      </p>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Générer le rapport d'expertise";
    }
  }

  // Fonction pour compter les lignes (à garder)
  function actualiserCompteurs() {
    const text = document.getElementById('studentText').value;
    const lines = text.split('\n').length;
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    document.getElementById('lineInfo').textContent = `Lignes utilisées : ${lines} / 25`;
    document.getElementById('wordInfo').textContent = `Nombre de mots : ${words}`;
  }
</script>
